---
# ThreatFlux Dependabot Configuration
# Routine version updates are grouped into one nightly pull request.
# Version: 1.0.0

version: 2
multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"

updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker (if Dockerfile exists)
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "nightly-dependencies"
    labels:
      - "dependencies"
      - "docker"
