# ThreatFlux CI Workflow
# Comprehensive Rust CI pipeline with best practices
# Version: 1.1.0

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  # No paths-ignore here, unlike `push` above. Branch protection requires this
  # workflow's checks, and a check that never runs never reports, so a skipped
  # workflow leaves a pull request permanently unmergeable rather than quickly
  # green. A documentation-only change pays a few CI minutes; the alternative is
  # that it cannot merge at all.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_STABLE_VERSION: 1.99.0
  RUST_MSRV_VERSION: 1.97.1

jobs:
  # ==========================================================================
  # Quick Checks - Fast feedback
  # ==========================================================================
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: rustfmt, clippy

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The lint levels live in [workspace.lints.clippy] and are deliberately not
      # repeated below. A crate-root `#![allow(clippy::all)]` outranks a
      # command-line -D and would leave the clippy step passing without checking
      # anything; a command-line group -D outranks the manifest's individual
      # allows. This checker refuses both.
      - name: Check lint configuration
        run: |
          python3 scripts/check_lint_config.py --self-test
          python3 scripts/check_lint_config.py

      # The tag stays in front of the digest so the docker ecosystem declared at
      # / in dependabot.yml can still resolve a newer version and bump both.
      - name: Check container image pins
        run: |
          python3 scripts/check_image_pins.py --self-test
          python3 scripts/check_image_pins.py

      # cargo-audit reads .cargo/audit.toml and cargo-deny reads deny.toml;
      # neither reads the other. Two lists that must stay identical need a
      # checker, and the security workflow is too late -- an `--ignore` flag
      # reintroduced on a command line should fail on the fast job.
      - name: Check advisory ignore lists
        run: |
          python3 scripts/check_advisory_ignores.py --self-test
          python3 scripts/check_advisory_ignores.py

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  # ==========================================================================
  # Test Suite - Cross-platform testing
  # ==========================================================================
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    needs: quick-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            rust: stable
          - os: linux
            runner: ubuntu-latest
            rust: beta
          - os: linux
            runner: ubuntu-latest
            rust: nightly
          - os: macos
            runner: macos-latest
            rust: stable
          - os: windows
            runner: windows-latest
            rust: stable
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust == 'stable' && '1.99.0' || matrix.rust }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-cargo-

      - name: Build
        run: cargo build --locked --workspace --all-features --verbose

      - name: Run tests
        run: cargo test --locked --workspace --all-features --verbose

      - name: Run doc tests
        run: cargo test --locked --workspace --doc --all-features

  # ==========================================================================
  # MSRV Check
  # ==========================================================================
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_MSRV_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  # ==========================================================================
  # Feature Checks
  # ==========================================================================
  features:
    name: Feature Checks
    runs-on: ubuntu-latest
    needs: quick-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-hack
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-hack@0.6.45

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-1.99.0-features-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check no default features
        run: cargo check --locked --workspace --no-default-features

      - name: Check all features
        run: cargo check --locked --workspace --all-features

      - name: Check feature combinations
        run: cargo hack check --locked --workspace --all-targets --feature-powerset

      # `encrypted-env` is the only feature that gates dependencies, so it is the
      # only one whose gate can silently stop holding: `default-features = false`
      # written on a member entry instead of the workspace entry is dropped by
      # cargo with a warning. This reads the resolved graph, not the manifests.
      - name: Check the optional dependency gate
        run: |
          python3 scripts/check_dep_gate.py --self-test
          python3 scripts/check_dep_gate.py

      # The refusals that fire when `encrypted-env` is off are unreachable from
      # `cargo test --locked --workspace --all-features`, which is every other test invocation in this
      # workflow.
      - name: Test the SDK without encrypted-env
        run: cargo test --locked -p threatflux-atlassian-sdk --no-default-features --features direct,remote

  # ==========================================================================
  # Documentation
  # ==========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quick-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check documentation drift and local links
        run: python3 scripts/check_docs.py

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test documentation examples
        run: cargo test --locked --workspace --doc --all-features

  # ==========================================================================
  # Benchmarks
  # ==========================================================================
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: quick-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-1.99.0-bench-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check benchmarks compile
        run: cargo bench --locked --workspace --all-features --no-run

  # ==========================================================================
  # Code Coverage
  # ==========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-1.99.0-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage
        run: |
          cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
          test -s lcov.info

      - name: Preserve coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          version: v11.3.1

  # ==========================================================================
  # CI Success Gate
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quick-check, test, msrv, features, docs, bench, coverage]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.quick-check.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.msrv.result }}" != "success" || \
                "${{ needs.features.result }}" != "success" || \
                "${{ needs.docs.result }}" != "success" || \
                "${{ needs.bench.result }}" != "success" || \
                "${{ needs.coverage.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs succeeded"
