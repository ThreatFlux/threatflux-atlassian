name: Auto Release

# A dry run gets its own group so it can never cancel a real release run.
concurrency:
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  # workflow_run is required to release only after CI and Security pass on main.
  # The reusable workflow gates on a successful run from this repository (never
  # a fork) and executes no code from the triggering checkout.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Analyze and report without creating any commit, tag, release or PR
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  registry-security:
    name: Registry security readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Enforce registry security release order
        run: python3 scripts/check_registry_release.py

  release:
    needs: registry-security
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@ad88f2f0cc91e6a4f2737040af917e732a53e7cc # v0.7.8
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # main is protected with enforce_admins, so the version bump cannot be
      # fast-forwarded onto it. The threatflux-automation GitHub App pushes the
      # bump to automation/release and opens the release PR, which starts this
      # repository's pull_request CI. Once that PR is merged, the next run tags
      # the merged commit with the App token.
      create-pr: true
      release-branch: automation/release
      required-workflows: CI,Security
      # The App's tag push is an ordinary push, so release.yml (push: tags
      # v*.*.*) and docker.yml (push: tags v*) start by themselves and the
      # reusable workflow does not dispatch them (dispatch-on-app-token stays
      # false). The list is only used when the App variable and secret are both
      # absent and the release falls back to GITHUB_TOKEN, whose tag push starts
      # nothing.
      dispatch-workflows: release.yml,docker.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
