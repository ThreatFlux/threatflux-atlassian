name: Docs contract

on:
  push:
    branches: [main, dev]
    paths:
      - "README.md"
      - "docs/**"
      - "crates/**/README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "README.md"
      - "docs/**"
      - "crates/**/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-contract:
    name: Documentation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation drift and local links
        run: python3 scripts/check_docs.py
