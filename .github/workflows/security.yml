# ThreatFlux Security Workflow
# Comprehensive security scanning pipeline
# Version: 1.1.2

name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: 1.99.0
  RUST_VERSION: 1.99.0

jobs:
  # ==========================================================================
  # Security Audit
  # ==========================================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-audit
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.2

      # The ignore list is `.cargo/audit.toml`, not a flag. cargo-deny cannot
      # read that file, so `deny.toml` keeps its own copy and this checker fails
      # the build when the two disagree -- or when an `--ignore` flag, which
      # outranks both files, comes back onto a command line.
      - name: Check advisory ignore lists
        run: |
          python3 scripts/check_advisory_ignores.py --self-test
          python3 scripts/check_advisory_ignores.py

      - name: Run security audit
        run: cargo audit

      - name: Generate audit report
        run: |
          cargo audit --json > audit-report.json
          python3 -m json.tool audit-report.json > /dev/null

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # License and Dependency Check
  # ==========================================================================
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny@0.20.2

      # The checked-in policy is authoritative; never synthesize a fallback.
      - name: Check advisory ignore lists
        run: |
          python3 scripts/check_advisory_ignores.py --self-test
          python3 scripts/check_advisory_ignores.py

      - name: Require dependency policy
        run: test -s deny.toml

      - name: Check licenses
        run: cargo deny --locked --workspace --all-features check licenses

      - name: Check advisories
        run: cargo deny --locked --workspace --all-features check advisories

      - name: Check bans (informational findings)
        run: cargo deny --locked --workspace --all-features check bans
        continue-on-error: true

  # ==========================================================================
  # Supply Chain Security
  # ==========================================================================
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # Secret Scanning
  # ==========================================================================
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog Scan (informational findings)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.9
          extra_args: --only-verified
        continue-on-error: true

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSLo gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" gitleaks_checksums.txt | sha256sum --check --
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks Scan
        run: |
          gitleaks git . \
            --no-banner \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload Gitleaks results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
        if: always() && hashFiles('gitleaks.sarif') != ''

  # ==========================================================================
  # Unsafe Code Analysis
  # ==========================================================================
  unsafe-check:
    name: Unsafe Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master source pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify selected compiler
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install cargo-geiger
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-geiger@0.13.0

      - name: Collect unsafe code inventory (informational findings)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/geiger
        run: |
          set -euo pipefail
          mkdir -p geiger-reports
          for package in threatflux-atlassian-sdk threatflux-atlassian-cli threatflux-atlassian-action threatflux-atlassian-testkit; do
            (cd "crates/$package" && cargo geiger --locked --all-features --package "$package" --output-format Json) \
              > "geiger-reports/$package.json" 2> "geiger-reports/$package.stderr"
            python3 scripts/check_geiger_report.py "geiger-reports/$package.json" "$package"
          done

      - name: Retain unsafe code inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geiger-inventory
          path: geiger-reports
          if-no-files-found: error
          retention-days: 5

  # ==========================================================================
  # OSSF Scorecard
  # ==========================================================================
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
        continue-on-error: true

  # ==========================================================================
  # Security Success Gate
  # ==========================================================================
  security-success:
    name: Security Success
    runs-on: ubuntu-latest
    needs: [audit, deny, supply-chain, secrets, unsafe-check]
    if: always()
    steps:
      - name: Check security jobs
        run: |
          if [[ "${{ needs.audit.result }}" != "success" || \
                "${{ needs.deny.result }}" != "success" || \
                "${{ needs.supply-chain.result }}" != "success" || \
                "${{ needs.secrets.result }}" != "success" || \
                "${{ needs.unsafe-check.result }}" != "success" ]]; then
            echo "Security checks failed"
            exit 1
          fi
          echo "Security checks passed"
