version: 1
rules:
  - id: dependabot-high-issues
    when:
      event: issues
      action: opened
      actor_in:
        - dependabot[bot]
    extract:
      severity:
        from: issue.body
        regex: '(?mi)^severity:\s*(high|critical)\b'
    jira:
      project_key: KAN
      issue_type: Bug
      priority_by_severity:
        high: High
      summary: "{{ issue.title }}"
      description: "{{ issue.body }}"
      dedupe:
        strategy: sha256
        fields:
          - repository.full_name
          - issue.title
