[package]
name = "threatflux-atlassian-action"
description = "Config-driven GitHub Action runtime for Jira automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["jira", "atlassian", "github-actions", "automation", "threatflux"]
categories = ["development-tools", "command-line-utilities"]
# Consumed as a container action built from action.Dockerfile, never from the
# registry: release.yml publishes only the SDK and CLI packages.
publish = false

[dependencies]
anyhow.workspace = true
# The `GITHUB_OUTPUT` heredoc delimiter mixes a per-entry nonce from the OS
# CSPRNG into its digest, so that the delimiter published next to a value cannot
# be used to confirm a guess at that value.
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
sha2.workspace = true
# Deliberately no `features` list. The workspace entry is
# `default-features = false`, so the Action links the SDK without
# `encrypted-env` and neither fluxencrypt nor rsa reaches the container image.
# `scripts/check_dep_gate.py` fails the build if that stops being true. The
# Action reads its Jira credentials from the workflow environment in cleartext,
# so it never had a use for the decrypt path.
threatflux-atlassian-sdk.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serial_test.workspace = true
threatflux-atlassian-testkit = { path = "../threatflux-atlassian-testkit" }

[lints]
workspace = true
