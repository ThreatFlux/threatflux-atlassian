# ThreatFlux cargo-deny Configuration
# License and security policy for dependencies
# Version: 1.0.0

# https://embarkstudios.github.io/cargo-deny/

[graph]
# Target platforms to check
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

# =============================================================================
# Licenses
# =============================================================================
[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8

# Allow specific licenses (using SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
]

# Private crates can have any license
private = { ignore = true }

# Clarify licenses for specific crates if needed
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# =============================================================================
# Bans
# =============================================================================
[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"

# Wildcards in version specs
wildcards = "warn"

# A path dependency on an unpublished workspace member has no registry version to
# pin, so it reads as a wildcard. `threatflux-atlassian-testkit` is dev-only and
# `publish = false`; requiring a version on it would defeat the point, since a
# version field is exactly what stops `cargo publish` from stripping the entry.
allow-wildcard-paths = true

# Highlight which crate pulled in duplicates
highlight = "all"

# Workspace handling
workspace-default-features = "allow"
external-default-features = "allow"

# =============================================================================
# Advisories
# =============================================================================
[advisories]
# Advisory database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# How to handle yanked crates
yanked = "warn"

# Ignore specific advisories (add with justification).
#
# This list is deliberately duplicated in `.cargo/audit.toml`, because
# cargo-deny does not read that file and cargo-audit does not read this one.
# `scripts/check_advisory_ignores.py` fails the build when the two disagree, so
# an entry added or removed here has to be added or removed there in the same
# commit.
ignore = [
    # fluxencrypt currently depends on rsa 0.9.x and RustSec has not published
    # a fixed upgrade path for RUSTSEC-2023-0071 yet. The SDK's `encrypted-env`
    # feature takes that path out of the Action's graph and out of any consumer
    # on `default-features = false`, but `full` is still the default and the CLI
    # uses fluxencrypt directly, so the advisory is not discharged.
    "RUSTSEC-2023-0071",
]

# =============================================================================
# Sources
# =============================================================================
[sources]
# Lint level for unknown registries
unknown-registry = "deny"

# Lint level for unknown git sources
unknown-git = "warn"

# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allowed git sources (add organization repos as needed)
allow-git = []

[sources.allow-org]
# Allow git sources from specific organizations
github = ["threatflux"]
