# cargo-audit configuration.
#
# This file is the single source of truth for `cargo audit` ignores. It replaces
# the `--ignore RUSTSEC-...` flags that used to be spelled out in the Makefile's
# `audit` target and twice in .github/workflows/security.yml, where three copies
# of the same list could drift apart one commit at a time.
#
# cargo-deny does NOT read this file. Its own `[advisories] ignore` list in
# deny.toml is a fourth site that has to say the same thing, so
# `scripts/check_advisory_ignores.py` fails the build when the two disagree and
# when a `--ignore RUSTSEC-...` flag reappears on a command line.

[advisories]
# FluxEncrypt 0.8 requires patched RSA 0.10; no advisory exception is needed.
ignore = []
